<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h2>unordered list</h2>
    <ul type="disk">
        <li>frontend development framework</li>

        <li value="10">python</li>
        <li>java</li>  
    </ol>
</body>
</html>
